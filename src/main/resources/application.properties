spring.application.name=candle-aggregation

server.port=8080

# Expose health + info endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=candle-aggregation-group

spring.kafka.listener.missing-topics-fatal=false

# Log aggregation events at INFO; set to DEBUG to see every tick
logging.level.com.example.candleaggregation=INFO
